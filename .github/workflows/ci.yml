name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore (locked)
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release
      - name: Secret scan
        run: |
          git diff --no-color -U0 origin/main...HEAD 2>/dev/null | grep -E '^\+[^+]' | grep -Eq 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}' && { echo "secret found"; exit 1; } || true
